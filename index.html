<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>쉼폰 - 스마트폰 사용 타이머</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F5F7FA;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 90%;
      max-width: 360px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 24px;
      color: var(--primary-color);
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .step-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #E1E4E8;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
      background: #fff;
    }

    .range-value {
      text-align: right;
      font-size: 14px;
      color: var(--primary-color);
      font-weight: bold;
      margin-top: 6px;
    }

    .status-badge {
      background-color: #EBF3FF;
      color: var(--primary-color);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 15px;
    }

    button:hover {
      background-color: #357ABD;
    }

    button:disabled {
      background-color: #A0C4EE;
      cursor: not-allowed;
    }

    /* === 가상 잠금 화면 (Full Screen Overlay) === */
    #lock-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      color: #FFFFFF;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .lock-icon {
      font-size: 50px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    .lock-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #4A90E2;
    }

    .lock-desc {
      font-size: 14px;
      color: #AAA;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .timer-display {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 2px;
      font-family: monospace;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px 25px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <!-- 메인 UI -->
  <div class="container">
    <h1>쉼폰 ,</h1>
    <p class="subtitle">일상의 쉼표를 더하는 시간</p>

    <!-- STEP 1: 스마트폰 사용 시간 설정 (1분 ~ 180분) -->
    <div class="step-group">
      <label for="use-time">STEP 1. 스마트폰 사용 시간</label>
      <input type="range" id="use-time" min="1" max="180" value="30" oninput="updateUseText(this.value)">
      <div class="range-value" id="use-text">30분 사용 가능</div>
    </div>

    <!-- STEP 2: 스마트폰 잠금 시간 설정 -->
    <div class="step-group">
      <label for="lock-time">STEP 2. 사용 후 잠금 시간</label>
      <select id="lock-time">
        <option value="600">10분 동안 잠금</option>
        <option value="1800">30분 동안 잠금</option>
        <option value="3600">1시간 동안 잠금</option>
        <option value="7200">2시간 동안 잠금</option>
        <option value="10800">3시간 동안 잠금</option>
        <option value="NEXT_MORNING">다음 날 아침 7시까지 잠금</option>
      </select>
    </div>

    <!-- 상시 위치 권한 상태 표시 -->
    <div class="status-badge">
      <span>📍</span> 위치 감지 상시 작동 중 (위험지역 감지)
    </div>

    <button id="start-btn" onclick="startShim()">쉼폰 시작하기</button>
  </div>

  <!-- 풀스크린 가상 잠금 화면 -->
  <div id="lock-overlay">
    <div class="lock-icon">🌿</div>
    <div class="lock-title">쉼표 시간이 시작되었습니다</div>
    <div class="lock-desc">
      스마트폰을 잠시 내려놓고 주변을 둘러보세요.<br>
      설정한 휴식 시간이 끝날 때까지 화면이 유지됩니다.
    </div>
    <div class="timer-display" id="lock-timer">00:00:00</div>
  </div>

  <script>
    let useTimer = null;
    let lockTimer = null;

    // 슬라이더 값(분)에 따른 텍스트 분/시간 변환 표시
    function updateUseText(val) {
      const minutes = parseInt(val);
      if (minutes >= 60) {
        const hours = Math.floor(minutes / 60);
        const remMins = minutes % 60;
        const timeStr = remMins > 0 ? `${hours}시간 ${remMins}분` : `${hours}시간`;
        document.getElementById('use-text').innerText = `${timeStr} 사용 가능`;
      } else {
        document.getElementById('use-text').innerText = `${minutes}분 사용 가능`;
      }
    }

    function startShim() {
      const useMinutes = parseInt(document.getElementById('use-time').value);
      const lockOption = document.getElementById('lock-time').value;

      // 잠금 시간(초) 계산
      let lockSeconds = 0;
      if (lockOption === 'NEXT_MORNING') {
        const now = new Date();
        const nextMorning = new Date();
        nextMorning.setDate(now.getDate() + 1);
        nextMorning.setHours(7, 0, 0, 0); // 다음 날 아침 07:00:00
        lockSeconds = Math.floor((nextMorning - now) / 1000);
      } else {
        lockSeconds = parseInt(lockOption);
      }

      alert(`[쉼폰 시작]\n${useMinutes}분 사용 후 화면 잠금이 시작됩니다.`);

      document.getElementById('start-btn').innerText = "타이머 동작 중...";
      document.getElementById('start-btn').disabled = true;

      // STEP 1: 설정한 사용 시간(분) 후 잠금 화면 실행
      useTimer = setTimeout(() => {
        triggerLockScreen(lockSeconds);
      }, useMinutes * 60 * 1000);
    }

    // 가상 잠금 화면 실행 함수
    function triggerLockScreen(durationSeconds) {
      const overlay = document.getElementById('lock-overlay');
      const timerDisplay = document.getElementById('lock-timer');
      
      overlay.style.display = 'flex'; // 풀스크린 레이어 표시

      // 전체화면 모드 요청
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // 새로고침/이탈 방지 이벤트 등록
      window.onbeforeunload = function() {
        return "잠금 시간이 끝나지 않았습니다. 정말 나갈까요?";
      };

      let remaining = durationSeconds;
      updateTimerDisplay(remaining, timerDisplay);

      // 잠금 카운트다운 시작 (1초 간격)
      lockTimer = setInterval(() => {
        remaining--;
        updateTimerDisplay(remaining, timerDisplay);

        if (remaining <= 0) {
          clearInterval(lockTimer);
          overlay.style.display = 'none'; // 잠금 해제
          window.onbeforeunload = null; // 이탈 방지 해제

          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }

          alert("휴식 시간이 종료되었습니다! 오늘 하루도 수고하셨습니다.");
          document.getElementById('start-btn').innerText = "쉼폰 시작하기";
          document.getElementById('start-btn').disabled = false;
        }
      }, 1000);
    }

    // 시:분:초 형식 포맷팅 함수
    function updateTimerDisplay(seconds, element) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      const formattedHrs = String(hrs).padStart(2, '0');
      const formattedMins = String(mins).padStart(2, '0');
      const formattedSecs = String(secs).padStart(2, '0');

      if (hrs > 0) {
        element.innerText = `${formattedHrs}:${formattedMins}:${formattedSecs}`;
      } else {
        element.innerText = `${formattedMins}:${formattedSecs}`;
      }
    }
  </script>

</body>
</html>
